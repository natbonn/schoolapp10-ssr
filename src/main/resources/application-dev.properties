spring.config.import=optional:file:.env[.properties]

## Database configuration ##
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:{MYSQL_PORT}/${MYSQL_DB}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

## Logging configuration ##
#logging.level.root=INFO      (default)
logging.level.gr.aueb.cf.schoolapp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

# production logging configuration / you may want JSON format / ecs json formatter
#logging.structured.format.console=ecs       (or logstash or gelf)

# rolling policy for log files (10MB max size, 7 days retention=default)
logging.file.name=logs/schoolapp.log

# disable thymeleaf cache for local development
spring.thymeleaf.cache=false
